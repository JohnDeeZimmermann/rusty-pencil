[package]
name = "pen-render"
description = "Document + editor overlay to a backend-neutral DrawList. No GUI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
pen-core.workspace = true
pen-editor.workspace = true
# Replaces the pressure, streamline, joins and cap geometry of a freehand outline.
perfect_freehand = "=0.1.1"

# One CPU SVG renderer replaces custom rasterization, image decoding and font shaping.
resvg = "0.45.1"
base64 = "0.22"
# Uses the same bundled fonts for measured export line breaks.
rustybuzz = "0.20"
thiserror.workspace = true

[lints]
workspace = true
