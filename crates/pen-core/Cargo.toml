[package]
name = "pen-core"
description = "Document model: elements, geometry, commands, file format. No GUI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Stable content identities deduplicate embedded image bytes.
blake3 = "1"
base64 = "0.22"
# Reads dimensions before decoding so embedded images have a strict pixel budget.
imagesize = "0.13"

[lints]
workspace = true
